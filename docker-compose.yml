services:
  postgres:
    image: postgres:16-alpine
    container_name: noc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: noc_user
      POSTGRES_PASSWORD: noc_password_local
      POSTGRES_DB: noc_db
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  qdrant:
    image: qdrant/qdrant:latest
    container_name: noc_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage

  app:
    build: ./app
    container_name: noc_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://noc_user:noc_password_local@postgres:5432/noc_db
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=phi3:latest
      - OLLAMA_EMBED_MODEL=nomic-embed-text
    volumes:
      - ./app:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - qdrant